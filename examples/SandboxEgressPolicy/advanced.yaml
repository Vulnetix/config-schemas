# yaml-language-server: $schema=https://github.com/Vulnetix/config-schemas/releases/latest/download/SandboxEgressPolicy.schema.json
apiVersion: vulnetix.com/v1
kind: SandboxEgressPolicy
metadata:
  name: dev-sandbox-egress
  annotations:
    ticket: https://tracker.example.com/SEC-88
spec:
  sandbox: 3c9e1f2a-7b4d-4e6f-8a1b-2c3d4e5f6a7b
  mode: deny_except_allow
  allow:
    - api.github.com
    - "*.githubusercontent.com"
    - registry.npmjs.org
  deny:
    - pastebin.com
