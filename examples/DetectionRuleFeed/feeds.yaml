# yaml-language-server: $schema=https://github.com/Vulnetix/config-schemas/releases/latest/download/DetectionRuleFeed.schema.json
apiVersion: vulnetix.com/v1
kind: DetectionRuleFeed
metadata:
  name: edge-waf
spec:
  displayName: Edge WAF virtual patches
  format: AWS_WAF
  entries:
    - ruleTable: virtual_patch
      ruleType: AWS_WAF
      rule: 9c2d4e6f-1a3b-4c5d-8e7f-0a1b2c3d4e5f
      cve: CVE-2024-3400
  publish: true
---
apiVersion: vulnetix.com/v1
kind: DetectionRuleFeed
metadata:
  name: kev-sigma
spec:
  format: SIGMA
  selector:
    when: kev && confidence == 'HIGH' && kind == 'SIGMA'
  publish: true
---
apiVersion: vulnetix.com/v1
kind: DetectionRuleFeed
metadata:
  name: ids-catalogue
spec:
  format: SNORT_YARA
  entries:
    - { ruleTable: snort_rule, ruleType: SNORT, rule: 1f2e3d4c-5b6a-4978-8a9b-0c1d2e3f4a5b }
    - { ruleTable: yara_rule, ruleType: YARA, rule: 2a3b4c5d-6e7f-4a8b-9c0d-1e2f3a4b5c6d, disabled: true }
