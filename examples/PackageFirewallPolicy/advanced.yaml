# yaml-language-server: $schema=https://github.com/Vulnetix/config-schemas/releases/latest/download/PackageFirewallPolicy.schema.json
apiVersion: vulnetix.com/v1
kind: PackageFirewallPolicy
metadata:
  name: default
  labels:
    team: platform-security
  annotations:
    ticket: https://jira.example.com/browse/SEC-2210
spec:
  mode: enforce
  thresholds:
    cvss: 9.0
    epss: 0.5
    cess: 8.0
  block:
    malware: true
    eol: true
    kev: true
    weaponized: true
    active: true
    poc: false
    badActors: true
  cooldownDays: 3
  versionLag: 10
  review:
    staleDecisionDays: 180
    staleUsageDays: 60
  ecosystems:
    npm: { mode: allowlist_only }
    go: { mode: warn }
    pypi: { mode: enforce }
  mirrors:
    - ecosystem: go
      url: https://proxy.golang.org
      priority: 0
      active: true
    - ecosystem: go
      url: https://goproxy.io
      priority: 1
      active: false
    - ecosystem: npm
      url: https://registry.npmjs.org
      priority: 0
    - ecosystem: pypi
      url: https://pypi.org/simple
      priority: 0
