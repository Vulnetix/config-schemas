# yaml-language-server: $schema=https://github.com/Vulnetix/config-schemas/releases/latest/download/JailPolicy.schema.json
apiVersion: vulnetix.com/v1
kind: JailPolicy
metadata:
  name: payments-api
  labels:
    team: payments
  annotations:
    ticket: https://tracker.example.com/SEC-1980
spec:
  repository: acme/payments-api
  description: Payments ships with no overdue criticals, no live secrets, and moment.js on its way out.
  enabled: true
  enforcementMode: enforce
  defaultStalenessDays: 7
  onStale: fail
  rules:
    - kind: VULN
      label: No reachable critical npm finding past its SLA
      enabled: true
      category: SCA
      toolName: vulnetix
      ecosystem: npm
      severityFloor: critical
      flags: [reachable, hasFix]
      aggregate: COUNT_PAST_SLA
      operator: GT
      thresholdLow: 0
      onBreach: BLOCK
      stalenessDays: 3
      onStale: warn
      ratchet: false
      when: "fixAvailability == 'available' && (kev || epss >= 0.1)"
    - kind: GOAL
      label: Off moment.js
      targetPattern: pkg:npm/moment@*
      aggregate: COUNT
      operator: GT
      thresholdLow: 0
      deadline: 2027-03-31
      ratchet: true
      onBreach: WARN
    - kind: HYGIENE
      label: Secrets stay between 0 and 2
      category: SECRETS
      aggregate: COUNT
      operator: OUTSIDE
      thresholdLow: 0
      thresholdHigh: 2
      onStale: pass
