# Golden vectors for the finding context. Each vector is an expression, an
# input, and either the boolean it must return (want) or the error code it must
# fail with (error). `at` pins the line and column of the first issue.
# Variables an input leaves out take their zero value.
context: finding
vectors:
  - name: critical and on a KEV list
    expr: severity == 'critical' && kev
    input: {severity: critical, kev: true}
    want: true

  - name: critical but not exploited
    expr: severity == 'critical' && kev
    input: {severity: critical, kev: false}
    want: false

  - name: an int literal compares with a double score
    expr: cvss >= 7
    input: {cvss: 7.5}
    want: true

  - name: epss below the threshold
    expr: epss > 0.1 || epssPercentile >= 0.95
    input: {epss: 0.02, epssPercentile: 0.5}
    want: false

  - name: semantic reachability counts as reachable
    expr: reachable && reachability == 'semantic'
    input: {reachability: semantic}
    want: true

  - name: unreachable is not reachable
    expr: reachable
    input: {reachability: unreachable}
    want: false

  - name: exposed weaponised exploit
    expr: internetExposed && exploitMaturity in ['active', 'weaponized']
    input: {internetExposed: true, exploitMaturity: weaponized}
    want: true

  - name: CWE membership
    expr: "'CWE-79' in cwe"
    input: {cwe: [CWE-89, CWE-79]}
    want: true

  - name: absent list is empty
    expr: size(cwe) == 0 && size(aliases) == 0
    input: {}
    want: true

  - name: suppress test fixtures by path glob
    expr: path.glob('**/testdata/**') && !direct
    input: {path: internal/scan/testdata/go.sum}
    want: true

  - name: glob star stops at a slash
    expr: path.glob('*.lock')
    input: {path: frontend/yarn.lock}
    want: false

  - name: namespace purl match
    expr: purl.matchesPurl('pkg:npm/@acme/*')
    input: {purl: "pkg:npm/%40acme/tool@1.2.3"}
    want: true

  - name: namespace never matches a longer sibling
    expr: purl.matchesPurl('pkg:npm/@acme/*')
    input: {purl: "pkg:npm/@acme-evil/tool@1.2.3"}
    want: false

  - name: invalid purl pattern fails at evaluation
    expr: purl.matchesPurl('npm/lodash')
    input: {purl: "pkg:npm/lodash@4.17.21"}
    error: eval

  - name: alias lookup
    expr: id == 'CVE-2021-44228' || aliases.exists(a, a == 'CVE-2021-44228')
    input: {id: GHSA-jfh8-c2jp-5v3q, aliases: [CVE-2021-44228]}
    want: true

  - name: fix available on the default branch only
    expr: fixAvailability == 'available' && branch == 'main' && repo.startsWith('vulnetix/')
    input: {fixAvailability: available, branch: main, repo: vulnetix/cli}
    want: true

  - name: comparing a score with a string is a type error
    expr: cvss == 'high'
    error: type
    at: {line: 1, column: 6}

  - name: unknown variable is a type error
    expr: score > 7
    error: type
    at: {line: 1, column: 1}

  - name: a variable from another context is a type error
    expr: malware
    error: type

  - name: a non-bool result is refused
    expr: cvss * 2.0
    error: result_type

  - name: unbalanced parenthesis is a syntax error
    expr: (severity == 'high'
    error: syntax

  - name: nested comprehensions exceed the estimated cost
    expr: aliases.exists(a, aliases.exists(b, aliases.exists(c, a + b == c)))
    error: cost

  - name: an input past a string bound is refused
    expr: severity == 'critical'
    input: {severity: criticalcriticalcriticalcriticalcriticalcriticalcriticalcriticalx}
    error: input

  - name: a label on the repository selects the finding
    expr: "labels['tier'] == 'prod' && severity in ['critical', 'high']"
    input: {severity: high, labels: {tier: prod, team: payments}}
    want: true

  - name: a missing label is not equal to anything
    expr: "'tier' in labels && labels['tier'] == 'prod'"
    input: {severity: high}
    want: false

  - name: no labels is an empty map
    expr: size(labels) == 0
    input: {}
    want: true

  - name: owner matches a team
    expr: owner == 'platform' || owner.endsWith('@acme.example')
    input: {owner: dana@acme.example}
    want: true

  - name: criticality of an unclassified repository is empty
    expr: criticality in ['high', 'critical']
    input: {}
    want: false

  - name: critical business repository with an exploited finding
    expr: criticality == 'critical' && (kev || exploitMaturity == 'weaponized')
    input: {criticality: critical, kev: true}
    want: true

  - name: labels are a map of strings, not of lists
    expr: "labels['tier'] == ['prod']"
    input: {labels: {tier: prod}}
    error: type

  - name: too many labels is refused rather than ignored
    expr: "labels['tier'] == 'prod'"
    input:
      labels:
        k01: v
        k02: v
        k03: v
        k04: v
        k05: v
        k06: v
        k07: v
        k08: v
        k09: v
        k10: v
        k11: v
        k12: v
        k13: v
        k14: v
        k15: v
        k16: v
        k17: v
        k18: v
        k19: v
        k20: v
        k21: v
        k22: v
        k23: v
        k24: v
        k25: v
        k26: v
        k27: v
        k28: v
        k29: v
        k30: v
        k31: v
        k32: v
        k33: v
        k34: v
        k35: v
        k36: v
        k37: v
        k38: v
        k39: v
        k40: v
        k41: v
        k42: v
        k43: v
        k44: v
        k45: v
        k46: v
        k47: v
        k48: v
        k49: v
        k50: v
        k51: v
    error: input
