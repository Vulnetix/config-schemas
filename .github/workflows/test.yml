name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: [self-hosted, Linux, X64, vulnetix-local]
    timeout-minutes: 10
    env:
      GOTMPDIR: ${{ runner.temp }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...
      - run: go run ./cmd/schemacheck release --version v0.0.0 --out "$RUNNER_TEMP/dist"
