name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: [self-hosted, Linux, X64, vulnetix-local]
    timeout-minutes: 10
    steps:
      # Big Go builds overflow the runner's small /tmp; build in the job's temp.
      - name: Use the job temp dir for Go
        run: echo "GOTMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/checkout@v5.1.0
      - uses: actions/setup-go@v6.5.0
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...
      - run: go run ./cmd/schemacheck release --version v0.0.0 --out "$RUNNER_TEMP/dist"
